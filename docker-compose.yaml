version: '3.9'
services:
  app:
    build: .
    ports:
      - '3001:3001'
    depends_on:
      - mysql
      - redis
    environment:
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      DATABASE_USER: root
      DATABASE_PASSWORD: root
      DATABASE_NAME: task_management
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - .:/app
    command: pnpm start:dev

  mysql:
    image: mysql:8
    ports:
      - '3307:3306'
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: task_management
    volumes:
      - db_data:/var/lib/mysql

  redis:
    image: redis:7
    ports:
      - '6379:6379'

volumes:
  db_data:
